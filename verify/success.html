<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPCO | Verification Successful</title>
    <link rel="stylesheet" href="../style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="topo-bg"></canvas>
    <main>
        <div class="glass-container">
            <img src="../assets/logo.webp" alt="WPCO Logo" style="width: 80px; height: 80px; margin-bottom: 1.5rem;" onerror="this.style.display='none'">
            <h2 style="font-size: 2.5rem; margin-bottom: 1rem; text-transform: uppercase;">VERIFICATION SUCCESSFUL</h2>
            <p style="font-size: 1.1rem; color: #e4e4e7; margin-bottom: 2rem;">Your Roblox account has been successfully linked to your Discord.</p>
            <p id="close-msg" style="font-size: 0.9rem; color: #a1a1aa; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">
                You may now safely close this tab and return to the WPCO Discord server.
            </p>
        </div>
        
        <p class="copyright">© 2023-2026 World Peace Control Organization. All Rights Reserved.</p>
    </main>
    <script src="../main.js"></script>
    <script>
        if (window.opener) {
            document.getElementById('close-msg').innerText = "This popup will close automatically in a moment...";
            window.opener.postMessage({ type: 'auth_result', success: true }, window.location.origin);
            setTimeout(() => window.close(), 1500);
        }
    </script>
</body>
</html>
