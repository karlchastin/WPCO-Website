<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operative Dashboard | WPCO</title>
  <meta name="theme-color" content="#050d17" />
  <link rel="icon" type="image/webp" href="assets/logo.webp" />
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <!-- WebGL Background -->
  <canvas id="topo-bg"></canvas>

  <main>
    <div class="glass-container dashboard-container">
      
      <!-- Topbar / Header -->
      <header class="topbar">
        <div class="topbar-left">
          <img src="assets/logo.webp" alt="WPCO Logo" class="dashboard-logo" draggable="false" />
          <div class="topbar-title">
            <h1 id="page-title">OPERATIONS</h1>
            <p id="page-subtitle">View and apply for active operations</p>
          </div>
        </div>
        
        <div class="user-profile" id="user-profile-widget" onclick="toggleHistoryModal()">
          <div class="profile-info">
            <span id="profile-name">Loading...</span>
            <span id="profile-status" class="status-badge loading">Authenticating...</span>
          </div>
          <div class="profile-avatar">
            <img id="profile-avatar-img" src="assets/logo.webp" alt="User Avatar" />
          </div>
        </div>
      </header>

      <!-- Operations View -->
      <section id="view-operations" class="view active">
        <div class="dashboard-content">
          <div class="filter-bar">
            <input type="text" id="job-search" placeholder="Search operations..." class="search-input" />
            <select id="job-filter" class="filter-select">
              <option value="all">All Types</option>
              <option value="Combat">Combat</option>
              <option value="Training">Training</option>
              <option value="Recon">Recon</option>
            </select>
          </div>
          
          <div id="job-board-grid" class="cards-grid">
            <div class="loading-spinner">Loading Operations...</div>
          </div>
        </div>
      </section>

      <!-- History Modal Overlay -->
      <div id="history-modal" class="modal-overlay" style="display: none; opacity: 0; transition: opacity 0.3s ease;">
        <div class="modal-content glass-container" style="padding: 2rem;">
          <button class="close-modal-btn" onclick="toggleHistoryModal()">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"></path></svg>
          </button>
          <h2 style="margin-top: 0; font-size: 1.8rem; margin-bottom: 1.5rem;">Operations History</h2>
          <div class="history-table-container">
            <table class="history-table">
              <thead>
                <tr>
                  <th>Codename</th>
                  <th>Type</th>
                  <th>Host</th>
                  <th>Concluded On</th>
                </tr>
              </thead>
              <tbody id="history-table-body">
                <tr><td colspan="4" class="text-center">Loading History...</td></tr>
              </tbody>
            </table>
          </div>
          <button id="logout-btn" class="glass-button" style="margin-top: 2rem; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;">
            Log Out
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="main.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
