<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operative Dashboard | WPCO</title>
  <meta name="theme-color" content="#050d17" />
  <link rel="icon" type="image/webp" href="assets/logo.webp" />
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <!-- WebGL Background -->
  <canvas id="topo-bg"></canvas>

  <main>
    <div class="app-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <img src="assets/logo.webp" alt="WPCO Logo" class="sidebar-logo" draggable="false" />
          <h2>WPCO</h2>
        </div>
        <nav class="sidebar-nav">
          <button class="nav-link active" data-target="view-operations">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            Active Operations
          </button>
          <button class="nav-link" data-target="view-history">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            My History
          </button>
        </nav>
        <div class="sidebar-footer">
          <button id="logout-btn" class="nav-link danger">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            Log Out
          </button>
        </div>
      </aside>

      <!-- Main Content Area -->
      <div class="dashboard-container">
        
        <!-- Topbar / Header -->
        <header class="topbar">
          <div class="topbar-left">
            <div class="topbar-title">
              <h1 id="page-title">OPERATIONS</h1>
              <p id="page-subtitle">View and apply for active operations</p>
            </div>
          </div>
          
          <div class="user-profile" id="user-profile-widget">
            <div class="profile-info">
              <span id="profile-name">Loading...</span>
              <span id="profile-status" class="status-badge loading">Authenticating...</span>
            </div>
            <div class="profile-avatar">
              <img id="profile-avatar-img" src="assets/logo.webp" alt="User Avatar" />
            </div>
          </div>
        </header>

        <!-- Operations View -->
        <section id="view-operations" class="view active">
          <div class="dashboard-content">
            <div class="filter-bar">
              <input type="text" id="job-search" placeholder="Search operations..." class="search-input" />
              <select id="job-filter" class="filter-select">
                <option value="all">All Types</option>
                <option value="Combat">Combat</option>
                <option value="Training">Training</option>
                <option value="Recon">Recon</option>
              </select>
            </div>
            
            <div id="job-board-grid" class="events-grid">
              <div class="event-banner skeleton" style="height: 160px;"></div>
              <div class="event-banner skeleton" style="height: 160px;"></div>
              <div class="event-banner skeleton" style="height: 160px;"></div>
            </div>
          </div>
        </section>

        <!-- History View -->
        <section id="view-history" class="view">
          <div class="dashboard-content">
            <div id="history-table-body" class="match-history-list">
              <div class="match-row skeleton" style="height: 70px;"></div>
              <div class="match-row skeleton" style="height: 70px;"></div>
              <div class="match-row skeleton" style="height: 70px;"></div>
              <div class="match-row skeleton" style="height: 70px;"></div>
            </div>
          </div>
        </section>

      </div>
    </div>
  </main>

  <script src="main.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
