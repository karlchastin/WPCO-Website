<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticket #2 Transcript | WPCO</title>
  <meta name="theme-color" content="#050d17" />
  <link rel="icon" type="image/webp" href="../assets/logo.webp" />
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../dashboard.css" />
  <style>
    .transcript-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
      color: #fff;
    }
    .ticket-header {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .ticket-header h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.8rem;
    }
    .ticket-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    
    .chat-log {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .chat-message {
      display: flex;
      gap: 1rem;
    }
    .chat-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--bg-surface);
    }
    .chat-content {
      flex: 1;
    }
    .chat-header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 0.25rem;
    }
    .chat-username {
      font-weight: 600;
      color: #fff;
    }
    .chat-timestamp {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    .chat-text {
      line-height: 1.5;
      color: #ddd;
      white-space: pre-wrap;
      word-break: break-word;
    }
    
    .attachment-preview {
      max-width: 300px;
      max-height: 300px;
      border-radius: 8px;
      margin-top: 0.5rem;
      border: 1px solid var(--border-color);
    }
    .attachment-link {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--primary-color);
      text-decoration: none;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .attachment-link:hover {
      background: var(--primary-color);
      color: #fff;
    }
  </style>
</head>
<body>
  <!-- WebGL Background -->
  <canvas id="topo-bg"></canvas>

  <main>
    <div class="dashboard-container" style="margin-left: 0;">
      <div class="transcript-container">
        
        <div class="ticket-header">
          <h1>Ticket #2 - Appeal</h1>
          <div class="ticket-meta">
            <div><strong>Creator ID:</strong> 330950042863271936</div>
            <div><strong>Created:</strong> 2026-09-07 10:53:01</div>
            <div><strong>Closed:</strong> 2026-09-07 11:00:05</div>
            <div><strong>Closed By:</strong> 1540845780808769626</div>
          </div>
          <div style="margin-top: 1rem; color: var(--text-secondary);">
            <strong>Reason:</strong> Testing only!
          </div>
          <div style="margin-top: 0.5rem; color: var(--text-secondary);">
            <strong>Close Reason:</strong> System Mass Close
          </div>
        </div>
        
        <div class="chat-log">

        </div>
      </div>
    </div>
  </main>
  
  <script>
    document.body.style.background = "#050d17";
  </script>
</body>
</html>
